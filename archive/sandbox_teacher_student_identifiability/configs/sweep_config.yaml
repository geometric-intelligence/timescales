# Sweep Configuration
# ====================
#
# Defines all parameters for the teacher-student identifiability sweep.
# Pass to the script with:
#
#   python teacher_student_identifiability.py --sweep-config configs/sweep_config.yaml
#
# Combine with --teacher-config to use custom teacher dynamics:
#
#   python teacher_student_identifiability.py \
#       --sweep-config configs/sweep_config.yaml \
#       --teacher-config configs/example_teacher.yaml

# =============================================================================
# Training Hyperparameters
# =============================================================================

n_epochs: 5000 #2000
batch_size: 128
T: 80           # Trajectory length
lr: 0.01        # Learning rate
lag: 20         # Burn-in steps to skip for trajectory loss
init_scale: 2.0 # Scale for random initial conditions

# =============================================================================
# Sweep Dimensions
# =============================================================================

# Activation functions to test
# Supported: "Tanh", "ReLU", "Identity"
activations:
  - "Tanh"
  - "ReLU"
  # - "Identity"

# Whether to zero the diagonal of W_rec (no self-connections)
# false = allow self-connections, true = no self-connections
zero_diags:
  - false
  - true

# Whether to precondition gradients by 1/alpha
preconditions:
  - false
  # - true

# Loss types to test
# "trajectory" = MSE on unrolled trajectories
# "vector_field" = MSE/cosine/angular on instantaneous dynamics
loss_types:
  # - "trajectory"
  - "vector_field"

# Vector field normalization modes (only used when loss_type = "vector_field")
# "none" = raw MSE
# "cosine" = 1 - cosine similarity
# "angular_mse" = MSE on unit-normalized vectors
vf_normalize_modes:
  - "none"
  - "cosine"
  # - "angular_mse"

# Network sizes (num_neurons)
num_neurons_list:
  - 10

# =============================================================================
# Total Experiments
# =============================================================================
#
# With defaults above:
#   3 activations × 2 zero_diags × 2 preconditions × (1 traj + 2 vf modes) = 36
#
# For trajectory loss: 3 × 2 × 2 × 1 = 12
# For vector_field loss: 3 × 2 × 2 × 2 = 24
# Total: 36 experiments
