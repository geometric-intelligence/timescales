# Example Teacher Configuration
# ==============================
#
# Use this file to specify custom teacher dynamics discovered through
# notebook exploration. Pass to the script with:
#
#   python teacher_student_identifiability.py --teacher-config configs/example_teacher.yaml
#
# The script will run the full sweep (activations, precondition, etc.)
# using these fixed teacher parameters instead of random initialization.

# Custom teacher dynamics (e.g., limit cycle oscillator)
# W_rec is a list of lists (matrix), shape (num_neurons, num_neurons)
# teacher_W:
#   - [0, -3.54]
#   - [3.54, 0]
teacher_W:
  - [0.0, 1.0]
  - [1.0, 0.0]

# Bias vector, shape (num_neurons,)
# teacher_b: [1.83, -2.20]
teacher_b: [0.0, 0.0]

# Teacher timescales (alphas), shape (num_neurons,)
# Values in (0, 1); larger = faster dynamics
teacher_alphas: [0.5, 0.3]

# Student timescales (different from teacher to test identifiability)
student_alphas: [0.1, 0.8]


