# Full experiment configuration for linear network timescales
run_experiment_a: true
run_experiment_b: true
seed: 42

experiment_a:
  n_eigenvalues: 1000
  tau_syn_values: [1.0, 10.0, 100.0]
  n_bins: 50

experiment_b:
  n_neurons: 1000
  g_coupling: 0.99
  tau_syn: 10.0
  dt: 1.0
  duration: 50000.0  # 50 seconds in ms
  noise_std: 0.1
  max_lag: 500
