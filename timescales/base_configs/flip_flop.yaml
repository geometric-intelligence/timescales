# N-bit Flip-Flop Task Configuration
# N independent binary memories driven by signed pulses.
# Network receives N input channels (+1 set, -1 reset, 0 hold) and must
# output the current state of all N bits at every timestep.

# General settings
project_name: "flip_flop"
model_type: "multitimescale"
task: "flip_flop"
seed: 0

# Device configuration
accelerator: "gpu"
devices: "auto"

# Task parameters
n_bits: 3
p_pulse: 0.05                 # P(pulse arrives for bit i) per timestep
pulse_amplitude: 1.0

# Trajectory parameters
num_time_steps: 500
dt: 0.1

# Model parameters
hidden_size: 256
activation: "Tanh"

# Timescale configuration
learn_timescales: true
init_timescale: 0.5
shared_timescale: false
normalize_hidden: false
zero_diag_wrec: true
recurrent_gain: 1.0
noise_std: 0.0
wrec_init: "orthogonal"
alpha_parameterization: "exponential"
dynamics_type: "rate"

# Training parameters
learning_rate: 0.001
weight_decay: 0.0001
step_size: 100
gamma: 0.5
max_epochs: 2000
num_trajectories: 10000
batch_size: 200
num_workers: 4
train_val_split: 0.8

# Logging
log_every_n_epochs: 5
viz_log_every_n_epochs: 100
grad_log_every_n_steps: 100
grad_track_per_weight_matrix: true
