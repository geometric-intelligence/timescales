# Sine-Wave Generation Task Configuration
# Autonomous oscillation: the network generates N (cos, sin) pairs at
# specified periods with no external input, starting from a uniform
# initial hidden state r_0 = init_hidden_value.

# General settings
project_name: "sine_wave"
model_type: "rnn"
task: "sine_wave"
seed: 0

# Device configuration
accelerator: "gpu"
devices: "auto"

# Task parameters
n_pairs: 1                        # number of (cos, sin) output pairs
periods: 10.0                     # period(s); scalar or list of length n_pairs
init_hidden_value: 1.0            # r_0 for all neurons
random_phase: false

# Trajectory parameters
num_time_steps: 200
dt: 0.1

# Model parameters
hidden_size: 256
activation: "Tanh"

# Time constant configuration
learn_time_constants: false
time_constants_config:
  type: "discrete"
  values: [1.0]
shared_time_constant: false
normalize_hidden: false
zero_diag_wrec: false
recurrent_gain: 1.0
noise_std: 0.0
wrec_init: "normal_scaled"
alpha_parameterization: "exponential"
dynamics_type: "rate"

# Training parameters (step-based)
learning_rate: 0.001
weight_decay: 0.0001
max_steps: 3000
val_every_n_steps: 10
lr_step_size: 1500
gamma: 0.5
batch_size: 64
num_val_trajectories: 200
num_workers: 4

# Convergence metric (steps-to-convergence from the validation curve).
# The full curve is always logged, and every curve-based candidate is computed and
# stored under result["convergence"]["by_method"], so the headline can be chosen at
# aggregation time. Set convergence_metric to pick a headline now; leave it unset
# (default) to defer. Candidates: frac_of_final | mse_threshold | phase_amp_tol.
# convergence_metric: frac_of_final
conv_final_frac: 0.9              # frac_of_final: fraction of the run's own final R^2
conv_mse_threshold: 0.1          # mse_threshold: converged when (1 - R^2) <= this

# Logging
viz_log_every_n_steps: 500
grad_log_every_n_steps: 100
grad_track_per_weight_matrix: true
