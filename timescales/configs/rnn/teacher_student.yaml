# Teacher-Student Task Configuration
# A fixed random teacher RNN generates targets from smoothed random inputs.
# The student RNN trains to reproduce the teacher's input-output mapping.

# General settings
project_name: "teacher_student"
model_type: "rnn"
task: "teacher_student"
seed: 0

# Device configuration
accelerator: "gpu"
devices: "auto"

# Teacher parameters
teacher_hidden_size: 10
teacher_recurrent_gain: 0.99
teacher_timescale: 1.0            # tau (alpha = 1 - exp(-dt/tau) ~ 0.63)
teacher_activation: "Identity" #"Tanh"
teacher_wrec_init: "normal_scaled"
teacher_seed: 42

# Data parameters
input_dim: 2
output_dim: 2
num_sequences: 500
train_val_split: 0.8              # 400 train, 100 val
savgol_window: 5
savgol_polyorder: 2

# Trajectory parameters
num_time_steps: 20
dt: 1.0

# Student model parameters
hidden_size: 10
activation: "Identity" # or Tanh

# Time constant configuration
learn_time_constants: false
time_constants_config:
  type: "discrete"
  values: [1.0]
shared_time_constant: false
normalize_hidden: false
zero_diag_wrec: false
recurrent_gain: 1.0
noise_std: 0.0
wrec_init: "normal_scaled"
alpha_parameterization: "exponential"
dynamics_type: "rate"

# Training parameters (step-based)
learning_rate: 0.001
weight_decay: 0.0001
max_steps: 1500
val_every_n_steps: 10
lr_step_size: 1000
gamma: 0.5
batch_size: 100
num_workers: 4

# Logging
viz_log_every_n_steps: 500
grad_log_every_n_steps: 100
grad_track_per_weight_matrix: true
