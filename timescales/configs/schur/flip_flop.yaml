# N-bit Flip-Flop Task — Schur-parameterized RNN
#
# Architecture:
#   W_rec = Q T Q^T  (real Schur decomposition)
#   tau * dr/dt = -r + phi(W_rec r + W_in u) + noise
#   y_hat = W_out r
#
# Trainable options:
#   train_t: True  — learn quasi-upper-triangular T (eigenvalue structure)
#   train_q: False — keep orthogonal basis Q fixed (or learn with Cayley map)

# General
project_name: "flip_flop_schur"
model_type: "schur"
task: "flip_flop"
seed: 0

# Device
accelerator: "gpu"
devices: "auto"

# Task parameters
n_bits: 3
p_pulse: 0.05
pulse_amplitude: 1.0

# Trajectory
num_time_steps: 500
dt: 0.1

# Model
hidden_size: 256
tau: 0.5
recurrent_gain: 1.0
noise_std: 0.0
wrec_init: "normal_scaled"

# Schur parameterization
train_t: true
train_q: false
q_parameterization: "cayley"   # "cayley" | "free"

# Training (step-based)
learning_rate: 0.001
weight_decay: 0.0001
max_steps: 1500
val_every_n_steps: 10
lr_step_size: 1000
gamma: 0.5
batch_size: 200
num_val_trajectories: 2000
num_workers: 4
