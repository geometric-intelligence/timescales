# Sine-Wave Generation -- Heterogeneous Periods, 2-D N x Horizon Sweep
#
# Tests the capacity-bottleneck hypothesis as an interaction:
# the memorisation-vs-eigenvalue-placement transition is expected to lie
# along a diagonal in (N, num_time_steps) space, where N >~ T_train means
# the network has enough free modes to do a Prony-style fit of the finite
# training waveform without resorting to oscillatory eigenvalues.
#
# Periods = [20, 50, 100], dt=1.0.  num_time_steps in {200, 500, 1000, 2000}
# corresponds to slow-period cycles in {2, 5, 10, 20}.
#
# Total: 5 hidden_sizes x 4 num_time_steps x 1 seed = 20 runs

base_config: "configs/rnn/sine_wave.yaml"
n_seeds: 1

fixed_overrides:
  recurrent_gain: 0.98
  weight_decay: 0.0001
  max_steps: 2000
  val_every_n_steps: 20
  lr_step_size: 2500
  activation: "Identity"
  n_pairs: 3
  periods: [20.0, 50.0, 100.0]
  dt: 1.0
  init_hidden_value: 1.0
  track_gradients: false

grid:
  hidden_size:
    - 32
    - 64
    - 128
    - 256
    - 512
  num_time_steps:
    - 100
    - 200       # 2 slow cycles
    - 500       # 5 slow cycles
    - 1000      # 10 slow cycles
    - 2000      # 20 slow cycles

naming:
  format: "N_{hidden_size}_T_{num_time_steps}"
