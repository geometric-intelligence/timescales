# Sine-Wave Generation — Heterogeneous Periods, Gain Sweep (Tanh)
#
# 3 (cos, sin) pairs at periods 5, 20, 100 (spanning a 20× timescale range).
# Sweep recurrent gain g from sub-critical to super-critical.
# Tanh activation keeps dynamics bounded for g > 1.
#
# Total: 4 gains × 1 seed = 4 runs

base_config: "configs/rnn/sine_wave.yaml"
n_seeds: 1

fixed_overrides:
  hidden_size: 512
  max_steps: 2000
  val_every_n_steps: 10
  lr_step_size: 2500
  activation: "Identity"
  n_pairs: 3
  periods: [20.0, 50.0, 100.0]
  num_time_steps: 500
  init_hidden_value: 1.0
  track_gradients: false

grid:
  recurrent_gain:
    - 0.5
    - 0.7
    - 0.9
    - 0.98

naming:
  format: "g_{recurrent_gain}"
