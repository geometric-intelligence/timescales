# Reservoir Computing Phase Transition — Frozen W_rec, Gain Sweep
#
# W_rec is frozen at initialization; only W_in and W_out are trained.
# We sweep recurrent_gain to test whether a critical g exists
# where long Jacobian timescales become necessary for the task.
#
# Task: 6-bit flip-flop with heterogeneous p_pulse, N=512
#
# Total: 12 gain values × 3 seeds = 36 runs

base_config: "configs/rnn/flip_flop.yaml"
n_seeds: 4

fixed_overrides:
  hidden_size: 512
  max_steps: 5000
  val_every_n_steps: 10
  lr_step_size: 1500
  wrec_init: "normal_scaled"
  zero_diag_wrec: false
  n_bits: 6
  dynamics_type: "rate"
  activation: "Identity"
  p_pulse: [0.005, 0.007, 0.01, 0.02, 0.05, 0.1]
  num_time_steps: 1000
  freeze_wrec: true

grid:
  recurrent_gain:
    - 0.5

naming:
  format: "g_{recurrent_gain}"
