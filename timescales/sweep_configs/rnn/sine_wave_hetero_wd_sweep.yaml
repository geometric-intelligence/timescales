# Sine-Wave Generation -- Heterogeneous Periods, Weight Decay Sweep
#
# Sweep weight_decay (L2 penalty on W_rec) over several decades, including 0.
# Hypothesis is non-monotone:
#   - WD = 0 or tiny: memorisation is essentially free; expect generalisation
#     to be dominated by other axes.
#   - moderate WD: penalises the multi-mode interference solution more than
#     the small-rank eigenvalue-placement solution; may *help*.
#   - large WD: collapses W_rec toward zero; everything degrades.
#
# Total: 6 weight_decay values x 1 seed = 6 runs

base_config: "configs/rnn/sine_wave.yaml"
n_seeds: 1

fixed_overrides:
  hidden_size: 128
  recurrent_gain: 0.98
  max_steps: 2000
  val_every_n_steps: 10
  lr_step_size: 2500
  activation: "Identity"
  n_pairs: 3
  periods: [20.0, 50.0, 100.0]
  num_time_steps: 1000
  dt: 1.0
  init_hidden_value: 1.0
  track_gradients: false

grid:
  weight_decay:
    - 0.0
    - 1.0e-6
    - 1.0e-5
    - 1.0e-4
    - 1.0e-3
    - 1.0e-2

naming:
  format: "wd_{weight_decay}"
