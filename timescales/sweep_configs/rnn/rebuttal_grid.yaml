# Rebuttal grid — the post-review headline sweep (delta Sections 1, 3, 4).
#
# Crosses:  task {ff, sine}  x  init {uniform, powerlaw, lognormal}
#         x trainable {full, fixedA, reservoir}  x  g grid  x  seeds.
# Subsumes the Appendix-F 80-run grid (its conditions re-run deterministically:
# g in {0.5, 0.9}, init in {uniform, powerlaw}, trainable in {full, fixedA}).
#
# g is the PRIMARY comparison axis (R3): best homogeneous over g vs best
# power-law over g, reported for BOTH steps-to-convergence and final loss.
# LR stays fixed at 1e-3 (delta Section 2 — no reviewer raised it).
#
# Tau ranges are per-task, in physical time units (DataModule converts via dt),
# matching the Appendix-F grid:
#   ff   (dt=0.1): tau in [1, 200]   (= [10, 2000] steps)
#   sine (dt=1.0): tau in [10, 200]  (= [10, 200] steps)
# Log-normal uses the same range with defaults median=sqrt(min*max),
# sigma=ln(max/min)/4 (design decision — see presets.py).
#
# Run (8-GPU server):
#   poetry run python sweep.py --sweep sweep_configs/rnn/rebuttal_grid.yaml \
#       --gpus 0,1,2,3,4,5,6,7
# Resumable: re-invoke the same command after any interruption.

base_config: "configs/rnn/flip_flop_hetero.yaml"
n_seeds: 20
seeds_outermost: true   # first full pass over all conditions completes before seed 2

naming:
  format: "{task}_{init}_{trainable}_g{recurrent_gain}"

fixed_overrides:
  track_tau_trajectory: true
  track_spectral_snapshots: true
  eps_real_axis: 0.1
  conv_final_frac: 0.9
  conv_mse_threshold: 0.1
  learning_rate: 0.001

variants:
  task:
    ff:
      tau_min: 1.0
      tau_max: 200.0
    sine:
      project_name: sine_wave
      task: sine_wave
      n_pairs: 3
      periods: [20.0, 50.0, 100.0]
      init_hidden_value: 1.0
      random_phase: false
      num_time_steps: 100
      dt: 1.0
      num_val_trajectories: 200
      tau_min: 10.0
      tau_max: 200.0

  init:
    uniform:
      tau_init:
        scheme: uniform
        value: 1.0
    powerlaw:
      tau_init:
        scheme: powerlaw
        exponent: 1.0
    lognormal:
      tau_init:
        scheme: lognormal

  trainable:
    full:
      trainable: full
    fixedA:
      trainable: fixedA
    reservoir:
      trainable: reservoir

grid:
  recurrent_gain: [0.5, 0.7, 0.9, 0.95]
