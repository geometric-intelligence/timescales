# Sine-Wave Generation — Heterogeneous Periods, Hidden Size Sweep
#
# Fixed g=0.98 (best-performing gain from the gain sweep).
# Sweep hidden_size N to test the capacity-bottleneck hypothesis:
# smaller networks should be forced toward eigenvalue placement
# (generalises past training horizon), while larger networks can
# memorise the finite training sequence via mode interference.
#
# 3 (cos, sin) pairs at periods 20, 50, 100.
# Identity (linear) activation, dt=1.0, τ=1.0.
#
# Total: 6 sizes × 1 seed = 6 runs

base_config: "configs/rnn/sine_wave.yaml"
n_seeds: 1

fixed_overrides:
  recurrent_gain: 0.5
  max_steps: 2000
  val_every_n_steps: 10
  lr_step_size: 3000
  activation: "Identity"
  n_pairs: 3
  periods: [20.0, 50.0, 100.0]
  num_time_steps: 500
  init_hidden_value: 1.0
  track_gradients: false

grid:
  hidden_size:
    - 64
    - 128
    - 256
    - 512

naming:
  format: "N_{hidden_size}"
