# Sine-Wave Generation -- Heterogeneous Periods, dt Sweep (Nyquist test)
#
# Vary dt while keeping the total simulated training time T*dt = 1000 fixed.
# This isolates the "samples per period" / Nyquist axis from the
# "cycles seen" axis (which is held constant at 10 slow cycles).
#
# Periods = [20, 50, 100].  At dt=4 the fastest period is sampled at
# only 5 points per cycle; at dt=0.1 it is sampled at 200 per cycle.
# The "right" eigenvalue angle for the fast pair is omega*dt = 2*pi*dt/20,
# which approaches pi as dt -> 10 (Nyquist).
#
# Note: each entry must specify (dt, num_time_steps) jointly so total
# simulated time stays at 1000.  We use the experiments: format for that.
#
# Total: 6 (dt, num_time_steps) pairs x 1 seed = 6 runs

base_config: "configs/rnn/sine_wave.yaml"
n_seeds: 1

fixed_overrides:
  hidden_size: 128
  recurrent_gain: 0.98
  weight_decay: 0.0001
  max_steps: 2000
  val_every_n_steps: 10
  lr_step_size: 2500
  activation: "Identity"
  n_pairs: 3
  periods: [20.0, 50.0, 100.0]
  init_hidden_value: 1.0
  track_gradients: false

experiments:
  - name: "dt_0.1"
    overrides:
      dt: 0.1
      num_time_steps: 10000   # T*dt = 1000; 200 samples/fastest-period
  - name: "dt_0.25"
    overrides:
      dt: 0.25
      num_time_steps: 4000    # 80 samples/fastest-period
  - name: "dt_0.5"
    overrides:
      dt: 0.5
      num_time_steps: 2000    # 40 samples/fastest-period
  - name: "dt_1.0"
    overrides:
      dt: 1.0
      num_time_steps: 1000    # 20 samples/fastest-period
  - name: "dt_2.0"
    overrides:
      dt: 2.0
      num_time_steps: 500     # 10 samples/fastest-period
  - name: "dt_4.0"
    overrides:
      dt: 4.0
      num_time_steps: 250     # 5 samples/fastest-period (near Nyquist)
