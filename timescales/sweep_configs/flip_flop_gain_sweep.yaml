# Flip-Flop Gain Sweep: Recurrent Gain × Activation (Linear vs Tanh)
#
# Gaussian W_rec initialization (Normal(0, 1/N)), 3-bit flip-flop task.
# Sweeps over recurrent gain g and activation function (Identity vs Tanh).
#
# Total configurations: 5 gains × 2 activations = 10 experiments
# Seeds per config: 3
# Total runs: 30

base_config: "base_configs/flip_flop.yaml"
n_seeds: 3

fixed_overrides:
  wrec_init: "normal_scaled"
  n_bits: 3
  dynamics_type: "rate"

grid:
  recurrent_gain:
    - 0.3
    - 0.5
    - 0.8
    - 0.9
    - 0.99
  activation:
    - "Identity"
    - "Tanh"

naming:
  format: "g_{recurrent_gain}_{activation}"
