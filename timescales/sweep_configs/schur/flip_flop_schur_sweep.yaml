# Schur-parameterized RNN — Flip-Flop sweep
#
# Compares four training conditions:
#   1. Only T trained, Q fixed    (reference: eigenvalue structure learned)
#   2. Both T and Q trained       (full Schur decomposition trained)
#   3. T fixed, Q trained         (only basis learned)
#   4. Full W_rec trained (no Schur structure, reference baseline)
#
# Total configurations: 4 conditions x 1 gain = 4 experiments
# Seeds per config: 1
# Total runs: 4

base_config: "configs/schur/flip_flop.yaml"
n_seeds: 1

fixed_overrides:
  hidden_size: 32
  n_bits: 4
  p_pulse: [0.005, 0.007, 0.01, 0.02]
  max_steps: 1500
  wrec_init: "normal_scaled"
  recurrent_gain: 0.6

grid:
  train_t:
    - true
    - false
  train_q:
    - false
    - true

naming:
  format: "trainT_{train_t}_trainQ_{train_q}"
