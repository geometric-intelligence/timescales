# Coupled RNN on 3-bit Flip-Flop: trainable vs fixed W_s
#
# Heterogeneous pulse rates per bit (slow / medium / fast memory demands).
# Single tau_s = 1.0, single seed.
# Sweep axis: whether W_s is learned or kept random-fixed.
#
# Total: 2 configs x 1 seed = 2 runs

base_config: "base_configs/flip_flop_coupled.yaml"
n_seeds: 1

fixed_overrides:
  tau_s: 1.0
  p_pulse: [0.01, 0.05, 0.1]
  w_s_gain: 0.6
  wrec_init: "normal_scaled"

grid:
  trainable_w_s:
    - false
    - true

naming:
  format: "trainable_ws_{trainable_w_s}"
